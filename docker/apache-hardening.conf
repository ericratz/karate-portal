# Deny web access to dotfiles (.env, .git, .dockerignore, …). The app reads
# .env from disk at /var/www/html/karate/.env, which is under DocumentRoot, so
# without this Apache would serve it as plaintext — exposing DB credentials.
# Matches how production/XAMPP is configured (security.spec.js asserts this).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Honour the project's own .htaccess, as production does.
#
# The image previously ran with Apache's default AllowOverride None AND without
# the .htaccess copied in at all, so every rule in it was silently inert here:
# the security headers, and the blocks on portal/{cron,includes,vendor} and
# backups/migrations/node_modules/tests. Live (StackCP) honours it — verified
# 403 on /karate/portal/includes/paypal.php — so dev and CI were strictly less
# hardened than production while appearing to carry the same protections.
#
# Enabling AllowOverride here rather than restating the rules in this file is
# deliberate: one source of truth cannot drift out of sync with itself.
#
# The .htaccess sets Strict-Transport-Security, which is harmless over dev's
# plain HTTP — RFC 6797 §7.2 requires user agents to ignore an STS header
# received over insecure transport, so it cannot poison karate.test the way the
# .app gTLD's preloaded entry did in V4.5.
<Directory /var/www/html/karate>
    AllowOverride All
</Directory>
